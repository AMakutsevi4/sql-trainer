spring:
  application:
    name: sql-trainer
  datasource:
    url: jdbc:postgresql://localhost:5433/sqltrainer
    username: sqltrainer
    password: sqltrainer
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8181

vaadin:
  launch-browser: true
  devmode:
    devTools:
      enabled: false

app:
  admin:
    login: admin
    password: admin
