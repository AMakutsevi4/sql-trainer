<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="|${exam.title()} — SQL Trainer|">Экзамен</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="trainer">
    <form th:action="@{/exam/{id}/quiz(id=${exam.id()})}" method="post" id="quiz-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="trainer-nav">
            <button class="btn" type="submit" name="action" value="prev" th:disabled="${!hasPrev}">← Назад</button>
            <button class="btn" type="submit" name="action" value="next" th:disabled="${!hasNext}">Вперед →</button>
            <button class="btn btn-primary" type="submit" name="action" value="finish">Завершить экзамен</button>
            <span class="trainer-progress"
                  th:text="|Вопрос ${index + 1} из ${total} · отвечено ${answered} / ${total}|"></span>
            <span class="exam-timer" id="timer" th:text="|Осталось: ${timerText}|"
                  th:attr="data-seconds=${secondsLeft}"></span>
        </div>

        <div class="trainer-grid">
            <section class="trainer-panel">
                <div class="trainer-panel-title">Вопрос</div>
                <p class="trainer-description" th:text="${question.prompt()}"></p>
            </section>
            <section class="trainer-panel">
                <div class="trainer-panel-title">Варианты ответа</div>
                <div class="exam-answers"
                     th:classappend="${question.options().![hasImage()].contains(true) ? ' exam-answers-images' : ''}">
                    <label class="exam-option" th:each="opt : ${question.options()}"
                           th:classappend="${opt.hasImage() ? ' exam-option-with-image' : ''}">
                        <input th:if="${question.multiSelect()}" type="checkbox" name="option"
                               th:value="${opt.id()}" th:checked="${selected.contains(opt.id())}"/>
                        <input th:if="${!question.multiSelect()}" type="radio" name="option"
                               th:value="${opt.id()}" th:checked="${selected.contains(opt.id())}"/>
                        <span th:if="${!opt.hasImage()}" th:text="${opt.text()}"></span>
                        <span th:if="${opt.hasImage()}" class="exam-option-caption" th:text="${opt.text()}"></span>
                        <img th:if="${opt.hasImage()}" class="exam-option-image"
                             th:src="${opt.imageUrl()}" th:alt="${opt.text()}"/>
                    </label>
                </div>
                <div class="trainer-status is-bad" th:if="${statusText}" th:text="${statusText}"></div>
            </section>
        </div>
    </form>
</main>
<script>
(() => {
  const el = document.getElementById('timer');
  if (!el) return;
  let left = Number(el.dataset.seconds || 0);
  const tick = () => {
    if (left <= 0) {
      el.textContent = 'Осталось: 00:00';
      el.classList.add('is-bad');
      const form = document.getElementById('quiz-form');
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'action';
      input.value = 'finish';
      form.appendChild(input);
      form.submit();
      return;
    }
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const s = String(left % 60).padStart(2, '0');
    el.textContent = 'Осталось: ' + m + ':' + s;
    if (left <= 60) el.classList.add('is-bad');
    left -= 1;
    setTimeout(tick, 1000);
  };
  tick();
})();
</script>
</body>
</html>
