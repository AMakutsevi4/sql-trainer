<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">SQL Trainer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header class="app-header">
    <div class="app-header-inner">
        <a class="app-brand-link" th:href="@{/}">SQL Trainer</a>
        <nav class="app-nav">
            <a th:href="@{/}">Тренажёр</a>
            <a th:href="@{/exam}">Экзамен</a>
            <a th:if="${isAdmin}" th:href="@{/admin/users}">Ученики</a>
            <a th:if="${isAdmin}" th:href="@{/admin/progress}">Прогресс</a>
        </nav>
        <div class="app-user">
            <span th:if="${currentLogin != null}" th:text="${currentLogin}"></span>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-ghost">Выйти</button>
            </form>
        </div>
    </div>
</header>
<main th:replace="${content}">
</main>
</body>
</html>
